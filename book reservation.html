<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Reservation - Bugema University Library</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <!-- Header content from index.html -->
    </header>
    <main>
        <section class="request-form-page">
            <h2><i class="fa fa-book"></i> Book Reservation</h2>
            <form id="bookReservationForm" class="request-form">
                <div class="form-group">
                    <label for="bookTitle">Book Title *</label>
                    <input type="text" id="bookTitle" required placeholder="Enter the title of the book">
                </div>
                <div class="form-group">
                    <label for="bookAuthor">Author *</label>
                    <input type="text" id="bookAuthor" required placeholder="Enter the author's name">
                </div>
                <div class="form-group">
                    <label for="pickupDate">Preferred Pickup Date *</label>
                    <input type="date" id="pickupDate" required>
                </div>
                <div class="form-group">
                    <label for="pickupTime">Preferred Pickup Time *</label>
                    <input type="time" id="pickupTime" required>
                </div>
                <button type="submit" class="btn btn-primary">Submit Reservation</button>
            </form>
            <div id="reservationFeedback" class="feedback-message" style="display:none;"></div>
        </section>
    </main>
    <footer>
        <!-- Footer content from index.html -->
    </footer>
    <script src="app.js"></script>
</body>

</html>
