<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borrowing & Returns - Bugema University Library</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="logo">
            <a href="index.html"><img src="log.jpeg" alt="Library Logo"></a>
        </div>
        <nav class="nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="books.html">Books & Resources</a></li>
                <li><a href="services.html" class="active">Services</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="collections.html">Special Collections</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="search-login">
            <div class="search-wrapper">
                <input type="text" id="globalSearch" placeholder="Search catalogue...">
                <button class="btn search-btn"><i class="fa fa-search"></i></button>
            </div>
            <div id="auth-header-container">
                <button class="btn login-btn" id="headerLoginBtn"><i class="fa fa-user"></i> Login</button>
            </div>
        </div>
    </header>
    <!-- Modals -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2><i class="fa fa-sign-in-alt"></i> Library Login</h2>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginIdentifier">Library Card Number / Email *</label>
                    <input type="text" id="loginIdentifier" required
                        placeholder="Enter your library card number or email">
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password *</label>
                    <input type="password" id="loginPassword" required placeholder="Enter your password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
                <p class="form-footer">Don't have an account? <a href="#" id="switchToRegister">Register here</a></p>
            </form>
        </div>
    </div>

    <div id="registerModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2><i class="fa fa-user-plus"></i> Library Registration</h2>
            </div>
            <form id="registerForm">
                <div class="register-form-scroll">
                    <div class="form-group"><label for="regFullName">Full Name *</label><input type="text"
                            id="regFullName" required></div>
                    <div class="form-group"><label for="regEmail">Email Address *</label><input type="email"
                            id="regEmail" required></div>
                    <div class="form-group"><label for="regPassword">Password *</label><input type="password"
                            id="regPassword" required></div>
                    <div class="form-group"><label for="regPhone">Phone Number *</label><input type="tel" id="regPhone"
                            required></div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register & Get Library Card</button>
                <p class="form-footer">Already have an account? <a href="#" id="switchToLogin">Login here</a></p>
            </form>
        </div>
    </div>
    <main>
        <section class="request-form-page">
            <h2><i class="fa fa-exchange-alt"></i> Borrowing & Returns</h2>
            <form id="borrowReturnForm" class="request-form">
                <div class="form-group">
                    <label for="transactionType">Transaction Type *</label>
                    <select id="transactionType" class="form-control" required>
                        <option value="">Select type</option>
                        <option value="borrow">Borrow Book</option>
                        <option value="return">Return Book</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bookIdentifier">Book Title or ID *</label>
                    <input type="text" id="bookIdentifier" class="form-control" required
                        placeholder="Enter book title or library ID">
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
                <button type="reset" class="btn btn-secondary">Cancel</button>
            </form>
            <div id="borrowReturnFeedback" class="feedback-message" style="display:none;"></div>
        </section>
    </main>
    <footer>
        <!-- Footer content from index.html -->
    </footer>
    <script src="app.js"></script>
</body>

</html>
